agent_card:
  name: MolTrust Trust Registry
  description: >-
    Production trust infrastructure for autonomous AI agents. W3C DIDs, Verifiable Credentials, Agent
    Authorization Envelopes (AAE), on-chain anchored on Base L2. Reference implementation of the Trust
    Registry Binding for A2A v1.0.
  version: 1.0.1
  supported_interfaces:
  - url: https://api.moltrust.ch/a2a
    protocol_binding: JSONRPC
    protocol_version: '1.0'
  provider:
    organization: CryptoKRI GmbH
    url: https://moltrust.ch
  documentation_url: https://api.moltrust.ch/docs
  icon_url: https://moltrust.ch/img/moltrust-logo.png
  capabilities:
    streaming: false
    push_notifications: false
    extended_agent_card: true
    extensions:
    - {uri: 'https://moltrust.ch/extensions/trust-score/v1', required: false}
    - {uri: 'https://moltrust.ch/extensions/aae/v1', required: false}
    - {uri: 'https://moltrust.ch/extensions/erc8004/v1', required: false}
    - {uri: 'https://moltrust.ch/extensions/x402-payment/v1', required: false}
    - {uri: 'https://moltrust.ch/extensions/discovery-surfaces/v1', required: false}
    - {uri: 'https://moltrust.ch/extensions/caep/v1', required: false}
  security_schemes:
    apiKey: {type: apiKey, in: header, name: X-API-Key}
    moltrust-did: {type: apiKey, in: header, name: X-MolTrust-DID}
    aae-envelope: {type: http, scheme: bearer, bearerFormat: AAE-JWS, note: 'Declared; the card itself says "HTTP-auth-layer implementation in progress".'}
  default_input_modes: [text]
  default_output_modes: [text, data]
  signatures: 1
  skill_count: 13
  skills:
  - {id: trust-score, name: Agent Trust Score, tags: [trust, identity, verification, did, w3c, score]}
  - {id: did-resolution, name: DID Resolution, tags: [did, identity, w3c, resolution, dif]}
  - {id: credential-verification, name: Verifiable Credential Verification, tags: [vc, credential, aae, delegation, w3c]}
  - {id: wallet-binding, name: Wallet Binding Verification, tags: [wallet, payment, base, solana, x402, erc8004]}
  - {id: sybil-detection, name: Sybil & Anomaly Detection, tags: [security, sybil, anomaly, fraud-detection, moltguard]}
  - {id: compliance-assess, name: EU AI Act risk classification, tags: [compliance, eu-ai-act, risk, classification, annex-iii]}
  - {id: compliance-declaration, name: EU declaration of conformity (Annex V), tags: [compliance, annex-v, declaration, verifiable-credential]}
  - {id: compliance-report, name: Compliance report, tags: [compliance, report, audit]}
  - {id: compliance-incident, name: Article 73 serious-incident recording, tags: [compliance, incident, article-73, deadline]}
  - {id: delegation-create, name: UCAN delegation minting, tags: [delegation, ucan, authorization, capabilities]}
  - {id: delegation-verify, name: UCAN delegation verification, tags: [delegation, ucan, verification]}
  - {id: reputation-batch-sync, name: Batch reputation, tags: [reputation, batch, score]}
  - {id: anchors-batch, name: Merkle batch anchoring, tags: [anchoring, merkle, evidence, provenance]}
  skill_invocation: >-
    Skills are not invoked through A2A task methods. The card's extensions name the REST endpoints behind
    each skill (trust_score_endpoint https://api.moltrust.ch/skill/trust-score/{did}, did_resolution
    https://uresolver.moltrust.ch/1.0/identifiers/{did}, delegation_lookup, delegation_configure ...), and
    the provider's published "Trust Registry Binding v1" (https://moltrust.ch/bindings/trust-registry/v1.html)
    defines exactly that: a custom binding in which each skill maps to HTTPS endpoints rather than
    SendMessage/GetTask. The same skills are reachable as MCP tools (mcp/moltrust-ch-tool-crosswalk.yml).
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: true
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) with streaming,
    pushNotifications, extendedAgentCard and a six-entry extensions[] array. protocolVersion is present
    (pass) in the A2A 1.0.0 location - supportedInterfaces[0].protocolVersion "1.0" - there is no top-level
    protocolVersion, because this is a 1.0.0-shaped card (supportedInterfaces[] carries url,
    protocolBinding and protocolVersion together) rather than the 0.3.0 top-level triple. skills is an
    ARRAY (pass) of thirteen skills each with id, name, description, tags, examples, inputModes and
    outputModes. All optional discriminators are present: defaultInputModes ["text"], defaultOutputModes
    ["text","data"], and the transport declaration (protocolBinding JSONRPC on the interface). The card is
    additionally JWS-signed, with the signing key resolvable from the same host's JWKS - rarer than
    conformance itself in this catalog.
  deviations:
  - field: securityRequirements
    observed: key named securityRequirements (value []) instead of the specification's `security`
    note: >-
      A reader looking for AgentCard.security finds nothing; securitySchemes is populated but no requirement
      binds a scheme to the card or to any skill (skills[].security absent), so which scheme gates which
      skill has to be read from the extensions and the binding document.
  - field: supportedInterfaces[0].protocolBinding
    observed: JSONRPC, yet tasks/get and agent/getAuthenticatedExtendedCard return -32601 Method not found
    note: >-
      The card declares the standard JSONRPC binding, but the live endpoint implements none of the A2A task
      methods probed; the provider's own binding page says the skills are served over a custom "Trust
      Registry Binding" of HTTPS endpoints. A client that reads protocolBinding JSONRPC and calls
      message/send will not get an A2A task back. The provider's llms.txt describes the card as "A2A v1.0
      conformant, references custom protocol binding", which is closer to the truth than the field value.
  - field: capabilities.extensions[erc8004].params.agentId vs /.well-known/agent-registration.json
    observed: 33553 in the card, 21023 in the registration file
    note: Two different ERC-8004 agent ids are published for the platform identity.
  - field: securitySchemes.apiKey.description
    observed: '"Free tier is 100 requests/day" and "Paid tiers (Professional/Scale/Enterprise)"'
    note: >-
      The pricing page (2026-09-19) states 60 calls/hour and tiers Free / Base / Scale; the card text is
      stale relative to /billing/plans. Recorded in rate-limits/ and plans/.
  - field: capabilities.extensions[caep]
    observed: proprietary polling protocol self-described as "NOT SET/RFC 8417 compliant"
    note: Honest self-labelling by the provider; recorded so nobody reads "CAEP" as OpenID Shared Signals.
surface_relationship:
  note: >-
    MolTrust publishes four agent surfaces on one host and they are projections of the same trust core, not
    of one another. A2A: 13 card skills served over the custom binding. MCP: 53 tools at
    https://api.moltrust.ch/mcp (tools/list open). REST: 186 operations in the main OpenAPI plus 71 in
    the MoltGuard sub-API. MoltProof: a read-only verifier at /proof/ with no contract. The crosswalk in
    mcp/moltrust-ch-tool-crosswalk.yml binds MCP to REST; the card's extensions bind A2A skills to REST.
