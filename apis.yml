- name: MolTrust MCP Server
  description: Hosted streamable-HTTP Model Context Protocol server (serverInfo moltrust 1.28.1, protocol 2025-06-18)
    exposing 53 tools over the MolTrust and MoltGuard APIs - identity and credentials, MoltGuard scoring, MoltProof
    mandate conformance, swarm intelligence, badges, shopping, travel, skills, prediction markets, fantasy sports,
    music provenance and Salesguard. tools/list answers anonymously; tool calls carry MOLTRUST_API_KEY. Also distributed
    as the PyPI package moltrust-mcp-server for local stdio use.
  image: https://moltrust.ch/img/moltrust-logo.png
  humanURL: https://github.com/MoltyCel/moltrust-mcp-server
