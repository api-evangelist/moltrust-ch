- name: MolTrust DID Universal Resolver
  description: 'DIF Universal Resolver deployment for the did:moltrust method (and bridged did:moltrust:ext_* identifiers),
    returning W3C DID Documents at the standard /1.0/identifiers/{did} path. The did:moltrust method specification
    is published on moltrust.ch and a driver was contributed to the DIF universal-resolver project (PR #540).'
  image: https://moltrust.ch/img/moltrust-logo.png
  humanURL: https://moltrust.ch/did-method-spec.html
