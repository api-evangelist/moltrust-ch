apis:
- name: MolTrust API
  description: 'REST trust-registry API (FastAPI, v2.5, 186 operations): agent registration and DID resolution,
    W3C VC issue/verify, AAE delegation configuration, UCAN 0.10.0 delegation create/verify, stateless /enforce/check
    verdicts, Ed25519-signed trust scores, endorsements and swarm graph, EU AI Act compliance endpoints, credits
    and USDC deposits, ERC-8004 cross-links, CAEP polling events, interaction proof records and vertical credentials
    (sports, music). Auth by X-API-Key or X-MolTrust-DID; per-call credit metering.'
