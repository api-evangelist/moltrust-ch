- name: MoltGuard API
  description: 'Trust and integrity sub-API of MolTrust (Hono/Node, v1.5.0, 71 operations across 14 capability clusters):
    Base wallet risk scoring and sybil-cluster detection, Polymarket market-integrity checks and MoltRadar operator
    clustering, SKILL.md security audits with ten CWE-mapped checks, VerifiedSkill / BuyerAgent / TravelAgent /
    PredictionTrack credential issuance, MT Salesguard brand and reseller provenance, AAE evaluation, endorsement-graph
    queries and hash-verifiable TrustProof transparency records. Free reads are rate-limited; paid endpoints are
    priced per call in USDC on Base via x402 (X-PAYMENT header).'
  image: https://moltrust.ch/img/moltrust-logo.png
  humanURL: https://api.moltrust.ch/guard/api/info
