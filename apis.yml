aid: moltrust-ch
name: MolTrust
description: 'CryptoKRI GmbH (Zurich, CHE-115.481.407) operates MolTrust, a trust registry for autonomous AI agents:
  W3C DID identity (did:moltrust, did:web), W3C Verifiable Credential issuance and verification, Agent Authorization
  Envelopes (AAE, an IETF Internet-Draft) with UCAN delegation and stateless mandate enforcement, behavioural trust
  scores signed with Ed25519, EU AI Act compliance endpoints (risk classification, Annex V declarations as VCs,
  Article 73 incidents), ERC-8004 on-chain registration and Merkle-batched evidence anchoring on Base L2. The MoltGuard
  sub-API adds wallet trust scoring, sybil detection, prediction-market integrity and vertical credentials (shopping,
  travel, skills, music, sports, brand provenance) paid per call in USDC via x402. Published surfaces: two OpenAPI
  3.1 documents, a signed A2A agent card, a hosted MCP server with 53 tools, llms.txt on both hosts, JWKS / DID
  documents / x402 discovery under /.well-known, npm and PyPI SDKs, and an Upptime status page.'
