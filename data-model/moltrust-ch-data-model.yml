- from: Agent
  rel: has_many
  to: CAEPEvent
  via: caep/pending/{did}
- from: Agent
  rel: has_many
  to: InteractionProofRecord
  via: agent_did
- from: InteractionProofRecord
  rel: belongs_to
  to: AnchorBatch
