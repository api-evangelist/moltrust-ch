  notes: >-
    REMOTE: POST https://api.moltrust.ch/mcp with Accept "application/json, text/event-stream" answered
    initialize (200, text/event-stream, serverInfo {name: moltrust, version: 1.28.1}, protocolVersion
    2025-06-18) and issued an mcp-session-id; notifications/initialized returned 202; tools/list with that
    session id returned 53 tools with full inputSchema (saved verbatim to mcp/moltrust-ch-mcp-tools.json,
    41,921 bytes of SSE). resources/list and prompts/list both returned empty lists. A GET on the endpoint
    returns 406 and a POST without the session id returns 400 "Missing session ID" - the standard
    streamable-HTTP shape, not a gate. Discovery of the tool list needs NO credential; the tools themselves
    call the REST API and the paid/write ones need MOLTRUST_API_KEY (several tools take api_key /
    endorser_api_key / admin_key as explicit arguments). LOCAL: the same server ships on PyPI as
    moltrust-mcp-server 1.2.2 (2026-07-28); README install lines "claude mcp add moltrust -- uvx
    moltrust-mcp-server" and a claude_desktop_config.json block with env MOLTRUST_API_KEY. Note the version
    skew: the hosted server reports 1.28.1 while PyPI is 1.2.2 and llms.txt still says "v1.2.0 (40 tools)".
server:
  name: moltrust
  version: 1.28.1
  transport: streamable-http
  url: https://api.moltrust.ch/mcp
  protocol_version: '2025-06-18'
  capabilities: {tools: {listChanged: false}, resources: {subscribe: false, listChanged: false}, prompts: {listChanged: false}, experimental: {}}
  instructions: >-
    MolTrust - Trust Infrastructure for AI Agents. Register agents, verify identities, query reputation
    scores, rate agents, manage W3C Verifiable Credentials, query ERC-8004 on-chain agent registries on
    Base, score wallet trust, detect Sybil wallets, check prediction market integrity, track prediction
    market wallet performance and leaderboards, verify shopping/travel/skill credentials, and audit agent
    skills.
  discovery_document: well-known/moltrust-ch-mcp.json
  listings:
  - Glama (https://glama.ai/mcp/servers/@MoltyCel/moltrust-mcp-server) - per the README badge and the provider's blog post glama-mcp-server-listing.html
  - MCP registry name io.github.MoltyCel/moltrust-mcp-server (README mcp-name comment)
  - AWS Marketplace listing referenced on the developers page (not verified here)
auth:
  methods: [api-key]
  api_key:
    header: X-API-Key
    env: MOLTRUST_API_KEY
    obtain: POST https://api.moltrust.ch/auth/signup (email) or POST /auth/signup-did (Ed25519 proof of possession)
  oauth2: null
  note: No OAuth. /.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource are 404 on the MCP host (well-known/moltrust-ch-well-known.yml).
tool_count: 53
tools_file: mcp/moltrust-ch-mcp-tools.json
crosswalk: mcp/moltrust-ch-tool-crosswalk.yml
tool_areas:
  identity_and_credentials: [moltrust_register, moltrust_verify, moltrust_reputation, moltrust_rate, moltrust_credential, moltrust_credits, moltrust_deposit_info, moltrust_claim_deposit, moltrust_stats, moltrust_deposit_history, moltrust_erc8004]
  moltguard_scoring: [moltguard_score, moltguard_detail, moltguard_sybil, moltguard_market, moltguard_feed, moltguard_credential_issue, moltguard_credential_verify]
  moltproof_mandate_conformance: [moltproof_verdict, moltproof_mandate, moltproof_evidence, moltproof_registry, moltproof_verify]
  swarm_intelligence: [mt_get_trust_score, mt_get_swarm_graph, mt_get_swarm_stats, mt_register_seed]
  badges: [mt_get_badge, mt_issue_badge, mt_check_badge]
  shopping: [mt_shopping_info, mt_shopping_verify, mt_shopping_issue_vc]
  travel: [mt_travel_info, mt_travel_verify, mt_travel_issue_vc]
  skills: [mt_skill_audit, mt_skill_verify, mt_skill_issue_vc, mt_create_interaction_proof, mt_endorse_agent]
  prediction_markets: [mt_prediction_link, mt_prediction_wallet, mt_prediction_leaderboard]
