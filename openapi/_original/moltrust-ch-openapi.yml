  /admin/usage:
    get:
      summary: Admin Usage
      description: "API usage over 7, 30 or 90 days, read from the daily rollups.\n\nReads usage_daily, usage_daily_keys and\
        \ usage_daily_payments — never\nrequest_log, which keeps 30 days and would silently answer a 90-day\nquestion with\
        \ a 30-day one.\n\nTwo counting rules this endpoint exists to get right:\n\n* ``usage_daily.distinct_dids`` is stored\
        \ per\n  (day, endpoint, status, source, class) group. Summing it counts an agent\n  once per group it appears in.\
        \ Distinct identities therefore come from\n  usage_daily_keys, which is one row per (day, key) and can be counted\n\
        \  across a range honestly.\n* A 200 cannot be traced back to the 402 that preceded it — the rollup has\n  no per-request\
        \ identity. So \"conversion\" is reported as challenges issued\n  against payments actually settled (from payment_events),\
        \ and the 200s\n  are reported only for endpoints that also issued a 402, which is the\n  closest honest proxy."
      operationId: admin_usage_admin_usage_get
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/funnel:
    get:
      summary: Admin Funnel
      description: "Acquisition funnel since the epoch: registrations, then what followed.\n\nRegistrations per day by platform\
        \ bucket, and for each registered agent the\ntime to its first authenticated call, first credential and first x402\n\
        payment. The window is fixed at ``FUNNEL_EPOCH`` rather than a rolling N\ndays: the question is how the listings are\
        \ performing since they went out,\nand a rolling window would quietly drop the early cohort.\n\nThree measurement\
        \ limits are reported in the response rather than hidden:\n\n* ``platform`` is free-form, so unmapped values land\
        \ in ``other`` with the\n  raw strings listed beside the bucket.\n* First call comes from a daily rollup, so it is\
        \ a day count. An agent that\n  registers and calls an hour later scores 0 days, not 0.04.\n* First credential excludes\
        \ the AgentTrustCredential that registration\n  issues automatically. Counting it would make the column a constant\
        \ zero:\n  86 of 90 land within a minute of the agent's own created_at.\n* Payments carry a wallet. Rows are attributed\
        \ by ``payment_events.did``\n  when set, otherwise by ``agents.wallet_address``; ``payments.linkage``\n  says how\
        \ many rows either path could reach, so an empty payment column is\n  readable as missing linkage rather than as missing\
        \ revenue."
      operationId: admin_funnel_admin_funnel_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
