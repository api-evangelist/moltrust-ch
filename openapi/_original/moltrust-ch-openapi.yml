  /enforce/check:
    post:
      tags:
      - AAE Enforcement
      summary: Enforce Check Endpoint
      description: 'Laufzeit-Check fuer constraint_mode=enforce. Mandat und Transaktion kommen im Request.


        Der Kern (app/enforcement/enforce_check.py) liest keine Datenbank und haelt keinen

        Zustand: das Verdikt haengt ausschliesslich an mandate + transaction. Wer beide hat,

        rechnet den core_digest ohne diesen Server nach.


        Fail-closed: fehlt ein gueltiges Mandat, ist die Antwort DENY — nicht 4xx und nicht

        ein stiller Durchlauf. Der Aufrufer bekommt in beiden Faellen einen Record.


        Jeder Grant traegt `type_fields` (Pflicht, enthaelt "verb") und deklariert damit, woraus

        die Aktion besteht. `transaction.action` muss ein Objekt sein und genau diese Schluessel

        tragen; Empfaenger und Betrag bleiben Geschwister der Aktion und laufen ueber Constraints.'
      operationId: enforce_check_endpoint_enforce_check_post
      parameters:
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: X-MolTrust-DID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Moltrust-Did
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /enforce/ratify:
    post:
      tags:
      - AAE Enforcement
      summary: Enforce Ratify Endpoint
      description: 'Ratifiziert einen DENY- oder PENDING-Record aus /enforce/check.


        Der Vorgaenger wird NICHT veraendert. Zurueck kommt ein zweiter, eigenstaendiger Record,

        der ihn per core_digest referenziert — Historie durch Anhaengen.


        Der Kern (app/enforcement/ratify.py) liest keine Datenbank und haelt keinen Zustand. Wo

        der Betreiber die Kette ablegt, ist seine Sache; MolTrust speichert sie nicht.


        Die ratifizierende Autoritaet muss aus dem Mandat des Vorgaengers ableitbar sein und ihre

        Signatur muss pruefbar sein. Ist sie das nicht, kommt ein Record mit status=REJECTED

        zurueck (HTTP 200) — der Vorgaenger behaelt seinen Status. Ein nicht ratifizierbarer

        Vorgaenger (etwa ein PERMIT) ist dagegen ein Aufrufer-Fehler: 422.'
      operationId: enforce_ratify_endpoint_enforce_ratify_post
      parameters:
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: X-MolTrust-DID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Moltrust-Did
