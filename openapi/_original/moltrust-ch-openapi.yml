  /identity/badge/{did}:
    get:
      summary: Get Identity Badge
      description: "Identity badge — composite of agent metadata, current trust score and\nrating count, plus convenience\
        \ URLs for the public verify page and SVG\nbadge. Used by the moltrust.ch /verify/{did} frontend, which fetches\n\
        this JSON in parallel with /identity/badge/{did}.svg.\n\nReturns 200 with `verified: true` for any registered DID,\
        \ even if the\ntrust score is still withheld (insufficient endorsements). Returns 404\nonly when the DID is not registered\
        \ at all.\n\nFrontend contract (the fields the /verify/{did} page reads):\n  verified, tier, trust_score, grade, issued_at,\
        \ expires_at,\n  vc_hash, badge_url. Additional fields (display_name, withheld,\n  total_ratings, average_rating,\
        \ verify_url) are extras the page\n  ignores but other consumers (klaw gateway, etc.) may use."
      operationId: get_identity_badge_identity_badge__did__get
      parameters:
      - name: did
        in: path
        required: true
        schema:
          type: string
          maxLength: 80
          title: Did
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /identity/badge/{did}.svg:
    get:
      summary: Get Identity Badge Svg
      description: 'SVG badge for embedding/inlining on the moltrust.ch /verify/{did}

        page. The frontend fetches this in parallel with /identity/badge/{did}

        and inlines the result via r.text().


        Mirrors the rendering logic of /badge/{did:path} (which predates the

        /identity/* convention) so both URLs stay in lockstep. 1h cache.

        Returns 200 with a placeholder SVG even for unknown/unscored DIDs —

        matches the /badge/{did:path} behaviour (renders ''N/A'' rather than

        surfacing a 404 inline image).'
      operationId: get_identity_badge_svg_identity_badge__did__svg_get
