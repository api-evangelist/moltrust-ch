  /trust/gate/{did}:
    get:
      summary: Trust Gate
      description: "ALLOW/DENY a counter-party DID. F3 flywheel primitive.\n\nAlways returns HTTP 200; inspect `decision`\
        \ in the body.\n\nDecision tree:\n  1. Agent unknown                                                  → DENY agent_not_found\n\
        \  2. Phase 2 returns a real score:\n       score >= min_score                                           → ALLOW (behavioral)\n\
        \       score <  min_score                                           → DENY  insufficient_trust_score (behavioral)\n\
        \  3. Phase 2 withholds (< 3 endorsers, score is null):\n       allow_cold_start = false                         \
        \            → DENY  score_withheld\n       allow_cold_start = true:\n         cold_start_score is null          \
        \                         → DENY  score_withheld\n         cold_start_score >= min_score                         \
        \     → ALLOW (cold_start)\n         cold_start_score <  min_score                              → DENY  insufficient_trust_score\
        \ (cold_start)"
      operationId: trust_gate_trust_gate__did__get
      parameters:
      - name: did
        in: path
        required: true
        schema:
          type: string
          title: Did
      - name: min_score
        in: query
        required: false
        schema:
          type: number
          maximum: 100.0
          minimum: 0.0
          default: 50.0
          title: Min Score
      - name: context
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Context
      - name: allow_cold_start
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Allow Cold Start
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
