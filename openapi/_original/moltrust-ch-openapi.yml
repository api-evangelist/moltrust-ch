              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AdminLoginRequest:
      properties:
        username:
          type: string
          maxLength: 32
          title: Username
        password:
          type: string
          maxLength: 128
          title: Password
      type: object
      required:
      - username
      - password
      title: AdminLoginRequest
    AgentClassRequest:
      properties:
        agent_class:
          type: string
          title: Agent Class
          description: 'One of: orchestrator, autonomous, human_initiated, copilot'
        agent_framework:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Agent Framework
          description: e.g. langgraph, crewai, autogen
        agent_version:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Agent Version
        publisher:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Publisher
      type: object
      required:
      - agent_class
      title: AgentClassRequest
    AnchorsBatchRequest:
      properties:
        hashes:
          items:
            type: string
          type: array
          title: Hashes
          description: Hex sha256 leaf hashes (optionally 0x-prefixed)
        submit_onchain:
          type: boolean
          title: Submit Onchain
          description: Submit the Merkle root on-chain via the existing anchoring key
          default: false
      type: object
      required:
      - hashes
      title: AnchorsBatchRequest
    AssignBody:
      properties:
        did:
          type: string
          title: Did
      type: object
      required:
      - did
      title: AssignBody
    Body_aws_fulfillment_aws_fulfillment_post:
      properties:
        x-amzn-marketplace-token:
          type: string
          title: X-Amzn-Marketplace-Token
      type: object
      required:
      - x-amzn-marketplace-token
      title: Body_aws_fulfillment_aws_fulfillment_post
    BudgetCapRequest:
      properties:
        monthly_cap_chf:
          type: number
          minimum: 0.0
          title: Monthly Cap Chf
        warning_threshold:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Warning Threshold
          default: 0.8
      type: object
      required:
      - monthly_cap_chf
      title: BudgetCapRequest
    CheckoutRequest:
      properties:
        tier:
          type: string
          title: Tier
        currency:
          type: string
          title: Currency
          default: usd
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
        agent_did:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Did
        payer_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Payer Ref
        ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Ref
          description: Optional referral source tag (e.g. 'dsncon'). Stored on the subscription for attribution.
        success_url:
          type: string
          title: Success Url
          default: https://moltrust.ch/billing/success
        cancel_url:
          type: string
          title: Cancel Url
          default: https://moltrust.ch/billing/cancel
      type: object
      required:
      - tier
      title: CheckoutRequest
    ClaimOperatorRequest:
      properties:
        operator_did:
          type: string
          maxLength: 255
          title: Operator Did
      type: object
      required:
      - operator_did
      title: ClaimOperatorRequest
    CodeBody:
      properties:
        code:
          type: string
          title: Code
      type: object
      required:
      - code
      title: CodeBody
    ComplianceAssessRequest:
      properties:
        did:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Did
          description: Optional agent DID to attach the assessment to
        use_case:
          type: string
          maxLength: 2000
          title: Use Case
          description: Description of the AI system's use case
        intended_purpose:
          type: string
          maxLength: 2000
          title: Intended Purpose
          description: Intended purpose (Art 7(2)(a))
        annex_iii_area:
          anyOf:
          - type: integer
            maximum: 8.0
            minimum: 1.0
          - type: 'null'
          title: Annex Iii Area
          description: Annex III area 1-8, if known
        is_annex_i_safety_component:
          type: boolean
          title: Is Annex I Safety Component
          default: false
        requires_third_party_conformity:
          type: boolean
          title: Requires Third Party Conformity
          default: false
        performs_profiling:
          type: boolean
          title: Performs Profiling
          default: false
        prohibited_flags:
          items:
            type: string
          type: array
          title: Prohibited Flags
          description: Self-declared Art 5(1) flags
        derogation_claim:
          anyOf:
          - type: string
            maxLength: 64
