openapi: 3.2.0
info:
  title: MolTrust AWS Marketplace API
  version: '2.5'
tags:
- name: AWS Marketplace
paths:
  /aws/fulfillment:
    post:
      tags:
      - AWS Marketplace
      summary: Aws Fulfillment
      operationId: aws_fulfillment_aws_fulfillment_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_aws_fulfillment_aws_fulfillment_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Body_aws_fulfillment_aws_fulfillment_post:
      properties:
        x-amzn-marketplace-token:
          type: string
          title: X-Amzn-Marketplace-Token
      type: object
      required:
      - x-amzn-marketplace-token
      title: Body_aws_fulfillment_aws_fulfillment_post
