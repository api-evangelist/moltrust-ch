openapi: 3.2.0
info:
  title: MolTrust Credentials API
  version: '2.5'
tags:
- name: Credentials
paths:
  /credentials/issue:
    post:
      summary: Issue Vc
      operationId: issue_vc_credentials_issue_post
      parameters:
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueVCRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Credentials
  /credentials/verify:
    post:
      summary: Verify Vc
      operationId: verify_vc_credentials_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyVCRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Credentials
  /credentials/verify-chain:
    post:
      summary: Verify Delegation Chain Endpoint
      description: Full delegation chain verification with per-agent AAE lookup. RSAC Gap 2.
      operationId: verify_delegation_chain_endpoint_credentials_verify_chain_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationChainRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Credentials
components:
  schemas:
    VerifyVCRequest:
      properties:
        credential:
          additionalProperties: true
          type: object
          title: Credential
      type: object
      required:
      - credential
      title: VerifyVCRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    DelegationChainRequest:
      properties:
        credential_chain:
          items: {}
          type: array
          title: Credential Chain
      type: object
      title: DelegationChainRequest
    IssueVCRequest:
      properties:
        subject_did:
          type: string
          maxLength: 128
          title: Subject Did
        credential_type:
          type: string
          maxLength: 64
          title: Credential Type
          default: AgentTrustCredential
      type: object
      required:
      - subject_did
      title: IssueVCRequest
