openapi: 3.2.0
info:
  title: MolTrust Extended Agent Card API
  version: '2.5'
tags:
- name: ExtendedAgentCard
paths:
  /extendedAgentCard:
    get:
      summary: Extended Agent Card
      description: 'A2A v1.0 ExtendedAgentCard.


        Returns the public agent card extended with:

        - The platform''s own paid skills (endorsement)

        - MoltGuard sub-API discovery surface — skill + extensions built at request time

        from the live MoltGuard OpenAPI spec (cached 1h, see app/moltguard_discovery.py).

        Graceful-degrades to public-card-only if MoltGuard is unreachable AND cache empty.'
      operationId: extended_agent_card_extendedAgentCard_get
      parameters:
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: X-MolTrust-DID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Moltrust-Did
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - ExtendedAgentCard
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
