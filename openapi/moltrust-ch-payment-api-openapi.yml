openapi: 3.2.0
info:
  title: MolTrust Payment API
  version: '2.5'
tags:
- name: Payment
paths:
  /payment/lightning/invoice:
    post:
      summary: Create Lightning Invoice
      operationId: create_lightning_invoice_payment_lightning_invoice_post
      parameters:
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LightningInvoiceRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Payment
components:
  schemas:
    LightningInvoiceRequest:
      properties:
        amount_sats:
          type: integer
          maximum: 10000000.0
          minimum: 1.0
          title: Amount Sats
        description:
          type: string
          maxLength: 128
          title: Description
          default: MolTrust
      type: object
      required:
      - amount_sats
      title: LightningInvoiceRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
