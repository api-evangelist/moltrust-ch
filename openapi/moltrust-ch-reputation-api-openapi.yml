openapi: 3.2.0
info:
  title: MolTrust Reputation API
  version: '2.5'
tags:
- name: Reputation
paths:
  /reputation/query/{did}:
    get:
      summary: Get Reputation
      operationId: get_reputation_reputation_query__did__get
      parameters:
      - name: did
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
          title: Did
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Reputation
  /reputation/rate:
    post:
      summary: Rate Agent
      operationId: rate_agent_reputation_rate_post
      parameters:
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Reputation
  /reputation/batch-sync:
    post:
      tags:
      - Reputation
      summary: Reputation Batch Sync
      description: Batch reputation scores + ratings for up to 500 DIDs in a single query.
      operationId: reputation_batch_sync_reputation_batch_sync_post
      parameters:
      - name: X-API-Key
        in: header
        required: true
        schema:
          type: string
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReputationBatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ReputationBatchRequest:
      properties:
        dids:
          items:
            type: string
          type: array
          title: Dids
          description: DIDs to score (max 500)
      type: object
      required:
      - dids
      title: ReputationBatchRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RateRequest:
      properties:
        from_did:
          type: string
          maxLength: 128
          title: From Did
        to_did:
          type: string
          maxLength: 128
          title: To Did
        score:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Score
      type: object
      required:
      - from_did
      - to_did
      - score
      title: RateRequest
