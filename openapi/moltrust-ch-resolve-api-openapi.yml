openapi: 3.2.0
info:
  title: MolTrust Resolve API
  version: '2.5'
tags:
- name: Resolve
paths:
  /resolve/erc8004/{agent_id}:
    get:
      summary: Erc8004 Resolve
      description: Resolve an ERC-8004 agent ID on Base to its on-chain data + optional MolTrust cross-reference.
      operationId: erc8004_resolve_resolve_erc8004__agent_id__get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Resolve
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
