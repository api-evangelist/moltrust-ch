openapi: 3.2.0
info:
  title: Moltrust Ch Sitemap.xml API
  version: '2.5'
  description: 'Operations tagged Sitemap.xml across 2 of this provider''s published API definitions: moltrust-ch-openapi.json, moltrust-ch-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.moltrust.ch
  description: Production. The served openapi.json omits servers[]; the base is stated by the provider at https://moltrust.ch/developers.html (quickstart), in the agent card supportedInterfaces[0].url (https://api.moltrust.ch/a2a) and in did.json service[].serviceEndpoint (https://api.moltrust.ch).
tags:
- name: Sitemap.xml
paths:
  /sitemap.xml:
    get:
      summary: Sitemap Redirect
      description: 'api.moltrust.ch serves no sitemap; crawlers probing it 404. Redirect them

        to the website sitemap on moltrust.ch.'
      operationId: sitemap_redirect_sitemap_xml_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Sitemap.xml
x-refined-from:
- moltrust-ch-openapi.json
- moltrust-ch-openapi.yml
