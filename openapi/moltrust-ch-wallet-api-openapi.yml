openapi: 3.2.0
info:
  title: MolTrust Wallet API
  version: '2.5'
tags:
- name: Wallet
paths:
  /wallet/{address}:
    get:
      summary: Wallet Shadow Score
      description: Public wallet trust profile with shadow score based on on-chain activity.
      operationId: wallet_shadow_score_wallet__address__get
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          title: Address
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Wallet
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
