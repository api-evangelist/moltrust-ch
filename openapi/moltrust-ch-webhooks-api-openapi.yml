openapi: 3.2.0
info:
  title: Moltrust Ch Webhooks API
  version: '2.5'
  description: 'Operations tagged Webhooks across 2 of this provider''s published API definitions: moltrust-ch-openapi.json, moltrust-ch-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.moltrust.ch
  description: Production. The served openapi.json omits servers[]; the base is stated by the provider at https://moltrust.ch/developers.html (quickstart), in the agent card supportedInterfaces[0].url (https://api.moltrust.ch/a2a) and in did.json service[].serviceEndpoint (https://api.moltrust.ch).
tags:
- name: Webhooks
paths:
  /webhooks/payment:
    post:
      summary: Payment Webhook
      description: Receive Basescan webhook for incoming USDC payments to MolTrust wallet.
      operationId: payment_webhook_webhooks_payment_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Webhooks
x-refined-from:
- moltrust-ch-openapi.json
- moltrust-ch-openapi.yml
