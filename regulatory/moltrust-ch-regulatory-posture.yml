signals:
  data_subject_request:
    url: https://moltrust.ch/privacy.html
    section: Your rights
    channel: https://moltrust.ch/contact.html with subject line "Privacy - [right name]"
    stated_sla: Response within one month.
    rights_named:
    - access (Art. 15)
    - rectification (Art. 16)
    - erasure (Art. 17) - off-chain data only; on-chain anchors carry no personal data
    - restriction (Art. 18)
    - portability (Art. 20) - "JSON export available"
    - objection (Art. 21)
    - complaint to the Swiss FDPIC or an EU supervisory authority
    evidence:
    - source: https://moltrust.ch/privacy.html
      http_status: 200
      fetched: '2026-09-19'
      quote: '"Right of access (Art. 15) - Request a copy of personal data MolTrust holds about you. Response within
        one month." ... "How to exercise - Via /contact with subject line \"Privacy - [right name]\". Identity verification
        may be requested to prevent unauthorized disclosure."'
    note: A documented process with a channel and a stated response period; a section of the privacy notice, not
      a dedicated intake page (/privacy/requests 404). No API endpoint.
  subprocessors:
    url: https://moltrust.ch/privacy.html
    section: Third-country transfers
    dated: '2026-06-04'
    entries:
    - vendor: Hetzner
      purpose: primary hosting / data centre, Nuremberg backup
      location: Switzerland / Germany
    - vendor: Amazon Web Services (KMS)
      purpose: root signing key management
      location: eu-central-1 Frankfurt, SCCs via AWS DPA
    - vendor: Coinbase Inc. (Base L2)
      purpose: public-ledger anchoring of non-personal hashes
      location: United States
    evidence:
    - source: https://moltrust.ch/privacy.html
      http_status: 200
      fetched: '2026-09-19'
      quote: '"MolTrust operates primarily within Switzerland (Hetzner data centre, Nuremberg backup) and the EU."
        ... "AWS KMS (Frankfurt, eu-central-1) ... SCCs in place via AWS Data Processing Addendum." ... "Other sub-processors
        - A current list of sub-processors with their roles and location is maintained and available on request
        from the controller contact above."'
    note: Three processors are named with role and location inside a dated privacy notice; the FULL list is explicitly
      "available on request", not published. No standalone table (/legal/subprocessors, /subprocessors 404). Recorded
      as partial.
  data_residency:
    url: https://moltrust.ch/terms.html
    section: 6. Privacy & Compliance - Data Location
    evidence:
    - source: https://moltrust.ch/terms.html
      http_status: 200
      fetched: '2026-09-19'
      quote: '"Data Location - All data is processed and stored on infrastructure located in Switzerland, subject
        to Swiss data protection law."'
    - source: https://moltrust.ch/privacy.html
      http_status: 200
      fetched: '2026-09-19'
      quote: '"No personal data leaves Switzerland or the EEA in identifiable form."'
    note: A contractual residency statement (Switzerland) plus the privacy notice's regional detail (Nuremberg backup,
      Frankfurt KMS). No per-customer region selection is offered; /docs/data-residency 404.
