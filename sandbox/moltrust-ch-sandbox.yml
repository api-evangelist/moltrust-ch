  (200) + GET /stats
summary: 'There is no separate sandbox host or test-mode key prefix - one production host, one key. What the provider
  offers instead: a free tier that makes every read and the registration flow free to exercise; MoltGuard mock "sample"
  endpoints that return canned data with no auth; a keyless proof-of-possession registration that mints a DID with
  zero credits; a partner-tier test harness for endorsements; and the public /stats counters that separate test
  agents from real ones. No magic test values (cards, IBANs, tokens) exist because the API takes DIDs and wallets,
  not payment instruments.'
environments:
- name: production
  base_url: https://api.moltrust.ch
  note: 'The only environment. Terms 2: "No subscription or API key required for standard endpoints."'
test_vs_live_keys:
  separate_modes: false
  key_prefix: null
  note: 'The binding spec shows keys as "mt_..." in one example (X-API-Key: mt_...) but no prefix scheme is documented
    and no test/live split exists.'
free_exercise_paths:
- flow: get a key
  operation: signup_for_api_key_auth_signup_post
  cost: 0 credits; one key per email
- flow: keyless registration
  operation: register_agent_pop_identity_register_pop_post
  cost: 0; grants a DID + signed VC and a ZERO balance ("no spendable credits") - a way to create a real identity
    without any credit exposure
  challenge: register_challenge_identity_register_challenge_get
- flow: read a live trust score
  operation: get_trust_score_skill_trust_score__did__get
  cost: 0, public; the developers page quickstart uses did:moltrust:d34ed796a4dc4698 as a live example DID
- flow: resolve / verify / stats / pricing / health
  operations:
  - resolve_did_identity_resolve__did__get
  - public_stats_stats_get
  - credits_pricing_credits_pricing_get
  - health_check_health_get
  cost: 0
