generated: '2026-09-19'
method: probed
source: live probes of /.well-known/ on every MolTrust host, 2026-09-19 (curl, browser User-Agent)
summary: >-
  A genuine WellKnown hit, earned on the API host. api.moltrust.ch serves an A2A agent card at BOTH the
  canonical /.well-known/agent-card.json and the legacy /.well-known/agent.json (identical 13,075-byte
  signed bodies), a W3C did:web DID Document, an RFC 7517 JWKS, an ERC-8004 agent-registration file, an
  x402 v2 discovery document, an MCP discovery stub and the CAEP registry key; the apex host moltrust.ch
  mirrors the agent card, did.json, jwks.json and x402.json. NOTHING in the OAuth / OIDC family is served
  anywhere (no oauth-authorization-server, no oauth-protected-resource, no openid-configuration) - the API
  authenticates with X-API-Key / X-MolTrust-DID / x402, not OAuth - and there is no security.txt on any
  host, so NO SecurityTxt pointer is emitted. No api-catalog, ai-plugin.json, apis.json, ucp.json, acp.json
  or aauth-resource.json.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the served agent card (both paths, both hosts) plus did.json,
  jwks.json, x402.json, agent-registration.json, mcp.json and registry-key.json. SecurityTxt NOT emitted -
  RFC 9116 is unimplemented on every host (moltrust.ch, www, api, uresolver, status).
false_positive_watch: >-
  Neither host is an SPA catch-all: moltrust.ch returns a real nginx 404 (564-byte HTML) for unknown
  /.well-known/* paths and api.moltrust.ch returns FastAPI's 22-byte JSON {"detail":"Not Found"}. The 200s
  below carry parseable JSON documents with the expected shape. api.moltrust.ch/.well-known/x402 (no
  extension) is a 301 to /.well-known/x402.json, which the provider's own OpenAPI documents as a legacy
  alias.
